# Publica la web en GitHub Pages.
# Por ahora se ejecuta a mano (pestaña Actions → «Publicar en GitHub Pages» → Run workflow), porque antes
# hay que activar Pages una vez: Settings → Pages → Source: «GitHub Actions».
# Para publicar sola con cada cambio, agrega debajo de «on:»:
#   push:
#     branches: [orbita-pulse-prototipo]
name: Publicar en GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compilar para Pages
        run: npm run build
        env:
          # La dirección será https://<usuario>.github.io/<repositorio>/
          BASE_URL: /${{ github.event.repository.name }}/
      # Las rutas como /clientes/CLI-023 funcionan al recargar: GitHub Pages devuelve 404.html = la app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
