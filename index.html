<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Órbita: tablero predictivo de clientes para Green Services and Solutions SAS (prototipo con datos sintéticos)." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Órbita</title>
    <script>
      // Aplica el tema y el idioma guardados antes de pintar, para evitar un parpadeo.
      try {
        if (localStorage.getItem('orbita-tema') === 'dark') document.documentElement.dataset.theme = 'dark';
        if (localStorage.getItem('orbita-idioma') === 'en') document.documentElement.lang = 'en';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
